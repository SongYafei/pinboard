<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    PinBoard Icon v2 - 去掉蓝色底，只保留中心图案
    - 透明底
    - 主体配色：Fluent 蓝 (#0078D4) + 深灰 + 白高光
    - 深浅背景下都有辨识度
  -->

  <defs>
    <!-- 图钉金属帽：蓝色渐变 -->
    <radialGradient id="pinHeadGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5BB3F0" />
      <stop offset="55%" stop-color="#1888D8" />
      <stop offset="100%" stop-color="#0D5CA3" />
    </radialGradient>

    <!-- 针身：浅灰→深灰 -->
    <linearGradient id="pinBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8EEF4" />
      <stop offset="50%" stop-color="#C4CFDB" />
      <stop offset="100%" stop-color="#8A9AAD" />
    </linearGradient>

    <!-- 卡片阴影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="6" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 图钉整体阴影 -->
    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 三张错落的卡片（从底到顶） -->
  <g filter="url(#cardShadow)" transform="translate(512 640)">
    <!-- 最底层卡片：更深，有细微描边 -->
    <rect x="-270" y="-40" width="540" height="220" rx="28" ry="28"
          fill="#E4EAF0" stroke="#B8C3CF" stroke-width="2" transform="rotate(-4)" />
    <!-- 中间卡片 -->
    <rect x="-260" y="-55" width="520" height="210" rx="26" ry="26"
          fill="#F2F5F8" stroke="#C4CFDB" stroke-width="2" transform="rotate(2)" />
    <!-- 最上层卡片：纯白 + 描边，主视觉 -->
    <rect x="-250" y="-70" width="500" height="200" rx="24" ry="24"
          fill="#FFFFFF" stroke="#D0DBE6" stroke-width="2" />

    <!-- 内容线：标题（accent 蓝）+ 三条内容（灰） -->
    <rect x="-210" y="-40" width="260" height="14" rx="7" ry="7" fill="#0078D4" />
    <rect x="-210" y="-10" width="380" height="8" rx="4" ry="4" fill="#0078D4" opacity="0.30" />
    <rect x="-210" y="14" width="320" height="8" rx="4" ry="4" fill="#0078D4" opacity="0.30" />
    <rect x="-210" y="38" width="240" height="8" rx="4" ry="4" fill="#0078D4" opacity="0.30" />
  </g>

  <!-- 图钉：穿插在最上层卡片上，微倾斜 -12° -->
  <g filter="url(#pinShadow)" transform="translate(512 340) rotate(-12)">
    <!-- 针身（细长梯形 + 尖针） -->
    <path d="
      M -28 0
      L 28 0
      L 22 210
      L 0 250
      L -22 210
      Z"
      fill="url(#pinBodyGrad)" />

    <!-- 针身中线高光 -->
    <path d="
      M -5 10
      L 5 10
      L 3 200
      L 0 240
      L -3 200
      Z"
      fill="#FFFFFF" opacity="0.55" />

    <!-- 针帽（蓝色渐变圆） -->
    <circle cx="0" cy="-30" r="110" fill="url(#pinHeadGrad)" />
    <!-- 针帽底部暗影边（增加立体感） -->
    <ellipse cx="0" cy="60" rx="55" ry="14" fill="#000000" opacity="0.18" />
    <!-- 针帽顶部高光（"光斑"） -->
    <ellipse cx="-32" cy="-72" rx="38" ry="22" fill="#FFFFFF" opacity="0.75" />
    <!-- 针帽底部一圈细高光 -->
    <ellipse cx="0" cy="50" rx="75" ry="15" fill="#FFFFFF" opacity="0.20" />
  </g>
</svg>
